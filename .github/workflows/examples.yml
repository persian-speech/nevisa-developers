name: Documentation and examples
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r examples/python/requirements.txt
      - run: python -m pip install -r examples/browser/requirements.txt httpx
      - run: python -m compileall -q examples tests
      - run: node --check examples/javascript/nevisa.mjs
      - run: node --check examples/browser/pcm-worklet.js
      - run: node tests/pcm-worklet.mjs
      - run: bash -n examples/curl/asr.sh
      - run: python -m unittest discover -s tests -v
